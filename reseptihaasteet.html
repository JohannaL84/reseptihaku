<!DOCTYPE html>
<html lang="fi">
<head>
    <!-- Sivun metatiedot -->
    <meta charset="UTF-8"> <!-- Määrittää UTF-8-merkistökoodauksen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsiivinen näkymä mobiililaitteille -->
    <title>Reseptihaaste</title> <!-- Sivun otsikko -->

    <!-- Tyylitiedot -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Pääotsikon tyyli */
        h1 {
            font-size: 3rem;
            color: #ff6600;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            text-align: center;
            margin-bottom: 10px;
        }

        /* Keskustekstin tyyli */
        .p2 {
            font-size: 1.3rem;
            color: #333;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Haasteosion tyyli */
        section {
            margin-top: 20px;
        }

        /* Alaotsikon tyyli */
        h2 {
            font-size: 2rem;
            color: #ff6600;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
            text-align: center;
        }

        /* Listaelementin tyyli */
        ul {
            list-style-type: circle;
            margin: 20px auto;
            padding: 0;
            max-width: 600px;
            color: #444;
            font-size: 1.2rem;
            text-align: left;
        }

        /* Yksittäisen listakohdan tyyli */
        li {
            margin: 10px 0;
            padding: 5px 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Linkin tyyli */
        a {
            color: #007bff;
            font-weight: bold;
            text-decoration: none;
            margin-left: 10px;
        }

        /* Linkin hover-efekti */
        a:hover {
            text-decoration: underline;
        }

        /* Kiinteä takaisin-painike */
        .back-button {
            position: fixed;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Footerin tyyli */
        footer {
            margin-top: 20px;
            text-align: center;
            color: #fff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <!-- Taustakuva -->
    <div class="background"></div>

    <!-- Kirjautumistilan näyttö -->
    <div id="loginStatus" class="login-status"></div>

    <!-- Takaisin-painike, joka ohjaa edelliselle sivulle -->
    <button class="back-button" onclick="history.back()">&#8592; Takaisin</button>

    <!-- Sisältölaatikko -->
    <div class="content-box">
        <!-- Otsikko ja kuvaus -->
        <header>
            <h1>Reseptihaaste</h1>
            <p class="p2">Haasta muut käyttäjät reseptihaasteen kautta ja kerää pisteitä!</p>
        </header>

        <!-- Haasteiden listat -->
        <section>
            <h2>Aktiiviset haasteet</h2>
            <ul id="activeChallenges"></ul> <!-- Täytetään JavaScriptillä -->

            <h2>Menneet haasteet</h2>
            <ul id="pastChallenges"></ul> <!-- Täytetään JavaScriptillä -->
        </section>

        <!-- Käyttäjän pisteet näkyvät vain kirjautuneille käyttäjille -->
        <section id="pointsSection" style="display: none;">
            <h2>Omat pisteet</h2>
            <p class="p2"><strong>Pisteet:</strong> <span id="points">0</span></p>
        </section>
    </div>

    <!-- JavaScript-logiikka -->
    <script>
        // Paikallisen tallennuksen avainten määrittely
        const activeChallengesKey = "activeChallenges";
        const pastChallengesKey = "pastChallenges";
        const userKey = "loggedInUser";

        // Mock-data haasteille
        const mockActiveChallenges = [
            { title: "Kasvisruokahaaste", description: "Valmista herkullinen kasvisruoka!" },
            { title: "Kolmen ruokalajin illallinen", description: "Suunnittele ja toteuta illallinen alkuruoasta jälkiruokaan." },
            { title: "Jälkiruokahaaste", description: "Leivo tai valmista jälkiruoka ja jaa se muille!" }
        ];

        const mockPastChallenges = [
            { title: "Päivän smoothie", description: "Kokeile uusia makuyhdistelmiä smoothiessa." },
            { title: "Keittohaaste", description: "Valmista keitto käyttäen sesongin kasviksia." }
        ];

        // Tallennetaan mock-data paikalliseen tallennukseen, jos sitä ei vielä ole
        if (!localStorage.getItem(activeChallengesKey)) {
            localStorage.setItem(activeChallengesKey, JSON.stringify(mockActiveChallenges));
        }
        if (!localStorage.getItem(pastChallengesKey)) {
            localStorage.setItem(pastChallengesKey, JSON.stringify(mockPastChallenges));
        }

        // Tarkistetaan, onko käyttäjä kirjautunut sisään
        function isUserLoggedIn() {
            return JSON.parse(localStorage.getItem(userKey)) !== null;
        }

        // Näytetään haasteet sivulla
        function displayChallenges() {
            const activeChallenges = JSON.parse(localStorage.getItem(activeChallengesKey)) || [];
            const pastChallenges = JSON.parse(localStorage.getItem(pastChallengesKey)) || [];
            const activeList = document.getElementById("activeChallenges");
            const pastList = document.getElementById("pastChallenges");

            // Täytetään aktiiviset haasteet
            activeList.innerHTML = "";
            activeChallenges.forEach(challenge => {
                let li = document.createElement("li");
                li.textContent = `${challenge.title} - ${challenge.description}`;
                let link = document.createElement("a");
                link.href = "haaste.html"; // Linkki haasteen sivulle
                link.textContent = "Siirry haasteeseen";
                li.appendChild(link);
                activeList.appendChild(li);
            });

            // Täytetään menneet haasteet
            pastList.innerHTML = "";
            pastChallenges.forEach(challenge => {
                let li = document.createElement("li");
                li.textContent = `${challenge.title} - ${challenge.description}`;
                pastList.appendChild(li);
            });

            // Jos käyttäjä on kirjautunut sisään, näytetään pisteet
            if (isUserLoggedIn()) {
                displayUserPoints();
                document.getElementById("pointsSection").style.display = "block";
            }
        }

        // Näytetään käyttäjän pisteet
        function displayUserPoints() {
            const loggedInUser = JSON.parse(localStorage.getItem(userKey));
            if (loggedInUser) {
                document.getElementById("points").textContent = loggedInUser.points || 0;
            }
        }

        // Suoritetaan, kun sivu on ladattu
        document.addEventListener("DOMContentLoaded", displayChallenges);
    </script>

    <!-- Footer -->
    <div id="footer">
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </div>

    <!-- JavaScript-tiedostot -->
    <script src="loginStatus.js?v=1.0"></script> <!-- Kirjautumistilan hallinta -->
    <script src="tarkistus.js"></script>
</body>
</html>
