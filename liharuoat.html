<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liharuoat</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .results-container {
            margin: 20px auto;
            max-width: 800px;
            overflow-y: auto;
            max-height: 500px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .recipe-card {
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }

        .recipe-card:hover {
            background-color: #ffe5b4;
        }

        .recipe-card h3 {
            font-size: 1.5rem;
            color: #d32f2f;
        }

        .recipe-card a {
            display: block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .recipe-card a:hover {
            text-decoration: underline;
        }

        .share-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .share-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .load-more-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .load-more-button:hover {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <!-- Kirjautumistilan näyttö -->
    <div id="loginStatus" class="login-status"></div>

    <!-- Kiinteä takaisin-painike -->
    <button class="back-button" onclick="history.back()">&#8592; Takaisin</button>

    <div class="content-box"> <!-- Vaalea laatikko -->
        <header>
            <h1>Liharuoat</h1>
            <p class="p2">Täältä löydät mehevät liharuoat!</p>
        </header>

        <section id="resultsContainer" class="results-container">
        </section>

        <button id="loadMoreButton" class="load-more-button">Lataa lisää</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const API_URL = 'https://api.spoonacular.com/recipes/complexSearch';
            const API_KEY = 'd451e3d4e29b4796b9fa627c0c18a6ff';
            const query = 'meat';

            const resultsContainer = document.getElementById('resultsContainer');
            const loadMoreButton = document.getElementById('loadMoreButton');

            const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser')) || {};
            const userRecipes = loggedInUser.savedRecipes || [];

            let offset = 0;
            const limit = 10;

            function fetchMeatRecipes() {
                fetch(`${API_URL}?query=${query}&offset=${offset}&number=${limit}&apiKey=${API_KEY}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('API-haku epäonnistui');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.results.length === 0) {
                            if (offset === 0) {
                                resultsContainer.innerHTML = '<p>Ei löytynyt liharuoat.</p>';
                            } else {
                                loadMoreButton.style.display = 'none';
                                resultsContainer.innerHTML += '<p>Ei enää reseptejä ladattavaksi.</p>';
                            }
                            return;
                        }

                        data.results.forEach(recipe => {
                            const recipeElement = document.createElement('div');
                            recipeElement.classList.add('recipe-card');

                            recipeElement.innerHTML = `
                                <h3>${recipe.title}</h3>
                                <p>Katso reseptin tarkemmat tiedot linkistä.</p>
                                <a href="https://spoonacular.com/recipes/${recipe.title.replace(/ /g, '-').toLowerCase()}-${recipe.id}" target="_blank">Avaa resepti</a>
                                ${loggedInUser.username ? `
                                    <span class="heart-icon" data-recipe="${recipe.title}">&#10084;</span>
                                    <a href="#" class="share-link" data-recipe="${recipe.title}">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-share" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                            <path d="M14 9V5l7 7-7 7v-4H5V9h9zm-9 0H3v6h2V9z"/>
                                        </svg>
                                        Jaa resepti
                                    </a>
                                ` : ''}
                            `;
                            resultsContainer.appendChild(recipeElement);

                            // Lisää tapahtumankuuntelijat
                            if (loggedInUser.username) {
                                const heartIcon = recipeElement.querySelector('.heart-icon');
                                const shareLink = recipeElement.querySelector('.share-link');

                                heartIcon.addEventListener('click', function() {
                                    toggleFavoriteRecipe(heartIcon, recipe.title);
                                });

                                shareLink.addEventListener('click', function(event) {
                                    event.preventDefault();
                                    const shareUrl = `${window.location.origin}/resepti.html?name=${encodeURIComponent(recipe.title)}`;

                                    navigator.clipboard.writeText(shareUrl)
                                        .then(() => {
                                            alert('Reseptin linkki kopioitu leikepöydälle!');
                                        })
                                        .catch(() => {
                                            alert('Linkin kopiointi epäonnistui. Yritä uudelleen.');
                                        });
                                });
                            }
                        });

                        loadMoreButton.style.display = 'block';
                        offset += limit;
                    })
                    .catch(error => {
                        console.error('Virhe haun aikana:', error);
                        resultsContainer.innerHTML = '<p>Virhe haun aikana. Yritä uudelleen myöhemmin.</p>';
                    });
            }

            function toggleFavoriteRecipe(icon, recipeName) {
                if (!loggedInUser.username) {
                    alert('Kirjaudu sisään lisätäksesi reseptin suosikkeihin.');
                    return;
                }

                if (!userRecipes.some(recipe => recipe.name === recipeName)) {
                    userRecipes.push({ name: recipeName });
                    loggedInUser.savedRecipes = userRecipes;
                    localStorage.setItem('loggedInUser', JSON.stringify(loggedInUser));
                    icon.classList.add('favorited');
                    alert('Resepti lisätty suosikkeihin!');
                } else {
                    const index = userRecipes.findIndex(recipe => recipe.name === recipeName);
                    userRecipes.splice(index, 1);
                    loggedInUser.savedRecipes = userRecipes;
                    localStorage.setItem('loggedInUser', JSON.stringify(loggedInUser));
                    icon.classList.remove('favorited');
                    alert('Resepti poistettu suosikeista.');
                }
            }

            fetchMeatRecipes();
            loadMoreButton.addEventListener('click', fetchMeatRecipes);
        });
    </script>

    <!-- Footer -->
    <div id="footer">
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </div>

    <!-- JavaScript-tiedostot -->
    <script src="loginStatus.js?v=1.0"></script>

</body>
</html>
