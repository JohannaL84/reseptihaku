<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekisteröidy uudeksi käyttäjäksi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <div class="content-box"> <!-- Vaalea laatikko -->
        <header>
            <h1>Ruokareseptihaku</h1>
            <p>Liity mukaan ja aloita reseptimatkasi jo tänään!</p>
        </header>

        <section class="login-section">
            <h2>Rekisteröidy</h2>
            <form>
                <input type="text" placeholder="Käyttäjätunnus" required>
                <input type="email" placeholder="Sähköpostiosoite" required>
                <input type="password" placeholder="Salasana" required>
                <input type="password" placeholder="Vahvista salasana" required>
                <div class="button-container">
                    <button type="submit">Rekisteröidy</button>
                    <button type="button" onclick="location.href='index.html'">Takaisin etusivulle</button>
                </div>
            </form>
        </section>
    </div>

    <footer> <!-- Footer siirretty boksin ulkopuolelle -->
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </footer>
</body>
</html>
