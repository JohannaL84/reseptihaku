<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uusimmat reseptit</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .results-container {
            margin: 20px auto;
            max-width: 800px;
            overflow-y: auto;
            max-height: 500px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .recipe-card {
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }

        .recipe-card:hover {
            background-color: #ffe5b4;
        }

        .recipe-card h3 {
            font-size: 1.5rem;
            color: #d32f2f;
        }

        .recipe-card a {
            display: block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .recipe-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <!-- Kirjautumistilan näyttö -->
    <div id="loginStatus" class="login-status"></div>

    <!-- Kiinteä takaisin-painike -->
    <button class="back-button" onclick="history.back()">&#8592; Takaisin</button>

    <div class="content-box">
        <header>
            <h1>Päivän resepti</h1>
            <p class="p2">Mitä jos tänään kokeilet tehdä päivän reseptin?</p>
        </header>

        <section id="resultsContainer" class="results-container">
            <p>Ladataan päivän resepti...</p>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const API_URL = 'https://api.spoonacular.com/recipes/complexSearch';
            const API_KEY = 'd451e3d4e29b4796b9fa627c0c18a6ff';  // Lisää oma API-avaimesi
            const query = 'Recipe of the Day';  // Hakutermi
            const resultsContainer = document.getElementById('resultsContainer');

            function fetchLatestRecipes() {
                fetch(`${API_URL}?query=${query}&number=10&apiKey=${API_KEY}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('API-haku epäonnistui');
                        }
                        return response.json();
                    })
                    .then(data => {
                        resultsContainer.innerHTML = '';
                        if (data.results.length === 0) {
                            resultsContainer.innerHTML = '<p>Ei löytynyt uusia reseptejä.</p>';
                            return;
                        }

                        data.results.forEach(recipe => {
                            const recipeElement = document.createElement('div');
                            recipeElement.classList.add('recipe-card');
                            recipeElement.innerHTML = `
                                <h3>${recipe.title}</h3>
                                <p>Katso reseptin tarkemmat tiedot linkistä.</p>
                                <a href="https://spoonacular.com/recipes/${recipe.title.replace(/ /g, '-').toLowerCase()}-${recipe.id}" target="_blank">Avaa resepti</a>
                            `;
                            resultsContainer.appendChild(recipeElement);
                        });
                    })
                    .catch(error => {
                        console.error('Virhe haun aikana:', error);
                        resultsContainer.innerHTML = '<p>Virhe haun aikana. Yritä uudelleen myöhemmin.</p>';
                    });
            }

            // Lataa reseptit sivun avautuessa
            fetchLatestRecipes();
        });
    </script>

    <!-- Footer -->
    <div id="footer">
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </div>

    <!-- JavaScript-tiedostot -->
    <script src="loginStatus.js?v=1.0"></script>

</body>
</html>
