<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unohtunut salasana</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Otsikko, joka toimii linkkinä etusivulle -->
    <h1><a href="index.html" id="homeLink">Ruokareseptihaku</a></h1>

    <h2>Unohtunut salasana</h2>

    <form id="forgotPasswordForm">
        <label for="emailInput">Sähköposti:</label>
        <input type="email" id="emailInput" placeholder="Anna sähköpostiosoitteesi" required>

        <label for="newPasswordInput">Uusi salasana:</label>
        <input type="password" id="newPasswordInput" placeholder="Anna uusi salasana" required>

        <label for="confirmPasswordInput">Vahvista uusi salasana:</label>
        <input type="password" id="confirmPasswordInput" placeholder="Vahvista uusi salasana" required>

        <button type="button" onclick="resetPassword()">Lähetä</button>
    </form>

    <p id="message"></p>

    <script>
        function resetPassword() {
            const email = document.getElementById('emailInput').value;
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            const message = document.getElementById('message');

            // Varmistetaan, että sähköpostikenttä ei ole tyhjä
            if (!email) {
                message.textContent = 'Syötä sähköpostiosoitteesi.';
                message.style.color = 'red';
                return;
            }

            // Salasanan vahvuusvaatimukset
            const passwordRequirements = [
                {
                    regex: /.{12,}/,
                    error: 'Salasanan täytyy olla vähintään 12 merkkiä pitkä.'
                },
                {
                    regex: /[A-Z]/,
                    error: 'Salasanassa täytyy olla vähintään yksi iso kirjain.'
                },
                {
                    regex: /[a-z]/,
                    error: 'Salasanassa täytyy olla vähintään yksi pieni kirjain.'
                },
                {
                    regex: /[0-9]/,
                    error: 'Salasanassa täytyy olla vähintään yksi numero.'
                },
                {
                    regex: /[!@#$%^&*(),.?":{}|<>]/,
                    error: 'Salasanassa täytyy olla vähintään yksi erikoismerkki.'
                }
            ];

            // Tarkista salasanan vahvuus
            for (const requirement of passwordRequirements) {
                if (!requirement.regex.test(newPassword)) {
                    message.textContent = requirement.error;
                    message.style.color = 'red';
                    return;
                }
            }

            // Varmista, että salasanat täsmäävät
            if (newPassword !== confirmPassword) {
                message.textContent = 'Salasanat eivät täsmää!';
                message.style.color = 'red';
                return;
            }

            // Onnistunut salasanan palautus
            message.textContent = `Palautuslinkki lähetetty sähköpostiin: ${email}`;
            message.style.color = 'green';

            // Tyhjennä lomake
            document.getElementById('forgotPasswordForm').reset();
        }
    </script>
</body>
</html>
