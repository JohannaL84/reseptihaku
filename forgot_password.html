<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unohditko salasanasi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <!-- Kirjautumistilan näyttö -->
    <div id="loginStatus" class="login-status"></div>

    <!-- Kiinteä takaisin-painike -->
    <button class="back-button" onclick="history.back()">&#8592; Takaisin</button>

    <div class="content-box"> <!-- Vaalea laatikko -->
        <header>
            <h1>Ruokareseptihaku</h1>
            <p class="p2">Unohtuiko salasanasi? Ei hätää, voit palauttaa sen täällä!</p>
        </header>

        <section class="login-section">
            <h2>Salasanan palautus</h2>
            <form id="forgot-password-form">
                <input type="email" id="forgotEmail" placeholder="Sähköpostiosoite">
                <input type="text" id="forgotUsername" placeholder="Käyttäjätunnus (jos et muista sähköpostia)" style="display: none;">
                <p id="forgotError" class="p2" style="color: red;"></p>
                <p id="successMessage" class="p2" style="display: none; color: green;">Palautuslinkki on lähetetty sähköpostiisi.</p>
                <div class="button-container">
                    <button type="submit">Lähetä palautuslinkki</button>
                    <button type="button" onclick="location.href='index.html'">Takaisin etusivulle</button>
                </div>
            </form>
            
        </section>
    </div>

    <!-- Footer -->
    <div id="footer">
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </div>

    <!-- JavaScript-tiedostot -->
    <script src="loginStatus.js?v=1.0"></script>
    <script src="forgot_password.js"></script> <!-- Linkitetään palautustoiminto -->
</body>
</html>
