<!DOCTYPE html>
<html lang="fi">
<head>
    <!-- Sivun metatiedot ja tyylitiedoston linkitys -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unohditko salasanasi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div> <!-- Taustakuva, joka kattaa koko sivun -->

    <!-- Kirjautumistilan näyttö -->
    <div id="loginStatus" class="login-status"></div>

    <!-- Takaisin-painike, joka ohjaa käyttäjän edelliselle sivulle -->
    <button class="back-button" onclick="history.back()">&#8592; Takaisin</button>

    <!-- Sisältölaatikko, jossa palautuslomake sijaitsee -->
    <div class="content-box">
        <header>
            <!-- Sivun otsikko ja kuvaus -->
            <h1>Ruokareseptihaku</h1>
            <p class="p2">Unohtuiko salasanasi? Ei hätää, voit palauttaa sen täällä!</p>
        </header>

        <!-- Salasanan palautuslomake -->
        <section class="login-section">
            <h2>Salasanan palautus</h2>
            <form id="forgot-password-form">
                <!-- Sähköpostin syöttökenttä -->
                <input type="email" id="forgotEmail" placeholder="Sähköpostiosoite">

                <!-- Vaihtoehtoinen kenttä käyttäjätunnukselle (ei oletuksena näytössä) -->
                <input type="text" id="forgotUsername" placeholder="Käyttäjätunnus (jos et muista sähköpostia)" style="display: none;">

                <!-- Virheilmoitusalue -->
                <p id="forgotError" class="p2" style="color: red;"></p>

                <!-- Onnistumisviesti, joka näytetään palautuslinkin lähetyksen jälkeen -->
                <p id="successMessage" class="p2" style="display: none; color: green;">Palautuslinkki on lähetetty sähköpostiisi.</p>

                <!-- Painikkeet lomakkeen lähettämiseen ja takaisin etusivulle siirtymiseen -->
                <div class="button-container">
                    <button type="submit">Lähetä palautuslinkki</button>
                    <button type="button" onclick="location.href='index.html'">Takaisin etusivulle</button>
                </div>
            </form>
        </section>
    </div>

    <!-- Footer, jossa tekijänoikeustiedot -->
    <div id="footer">
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </div>

    <!-- JavaScript-tiedostojen linkitykset -->
    <script src="loginStatus.js?v=1.0"></script> <!-- Näyttää kirjautumistiedot käyttäjälle -->
    <script src="forgot_password.js"></script> <!-- Hoitaa salasanan palautuslomakkeen käsittelyn -->
</body>
</html>
