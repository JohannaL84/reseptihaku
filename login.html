<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirjaudu nykyisillä tunnuksillasi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <div class="content-box"> <!-- Vaalea laatikko -->
        <header>
            <h1>Ruokareseptihaku</h1>
            <p class="p2">Kirjaudu sisään ja jatka herkullisten reseptien selaamista!</p>
        </header>

        <section class="login-section">
            <h2>Kirjaudu</h2>
            <form>
                <input type="text" placeholder="Käyttäjätunnus" required>
                <input type="password" placeholder="Salasana" required>
                <div class="button-container">
                    <button type="submit">Kirjaudu</button>
                    <button type="button" onclick="location.href='register.html'">Luo uusi käyttäjä</button>
                </div>
            </form>
            <p class="p2">Unohtuiko salasana? <a href="forgot_password.html">Palauta salasana tästä.</a></p>
        </section>
    </div>

    <footer> <!-- Footer -->
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </footer>
</body>
</html>
