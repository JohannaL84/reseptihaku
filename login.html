<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirjaudu nykyisillä tunnuksillasi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <div class="content-box"> <!-- Vaalea laatikko -->
        <header>
            <h1>Ruokareseptihaku</h1>
            <p class="p2">Kirjaudu sisään ja jatka herkullisten reseptien selaamista!</p>
        </header>

        <section class="login-section">
            <h2>Kirjaudu</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Käyttäjätunnus tai sähköposti" required>
                <input type="password" id="password" placeholder="Salasana" required>
                <div class="button-container">
                    <button type="submit">Kirjaudu</button>
                    <button type="button" onclick="location.href='register.html'">Luo uusi käyttäjä</button>
                </div>
                <p id="loginError" class="p2" style="color: red;"></p>
            </form>
            

            <!-- Google-kirjautumisnappi -->
            <button type="button" onclick="googleLogin()" class="google-btn">
                Kirjaudu sisään Googlella
            </button>

            <p class="p2">Unohtuiko salasana? <a href="forgot_password.html">Palauta salasana tästä.</a></p>
        </section>
    </div>

    <footer> <!-- Footer -->
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </footer>

    <!-- Firebase SDK Google-kirjautumista varten -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>

    <script>
        // 🔹 Firebase-konfiguraatio (Google-kirjautuminen)
        const firebaseConfig = {
            apiKey: "AIzaSyAGE5QfzpVW_0hChXIY7FADwssb3rhcc9M",
            authDomain: "reseptijengi.firebaseapp.com",
            projectId: "reseptijengi",
            storageBucket: "reseptijengi.firebasestorage.app",
            messagingSenderId: "202829076304",
            appId: "1:202829076304:web:eace89cb84e1bf1714fe55"
        };

        // Alustetaan Firebase
        firebase.initializeApp(firebaseConfig);
    </script>

    <!-- JavaScript-tiedostot -->
    <script src="login.js"></script> <!-- Normaalin kirjautumisen logiikka -->
    <script src="google-login.js"></script> <!-- Google-kirjautumisen logiikka -->
</body>
</html>
