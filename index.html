<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruokareseptihaku</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div>

    <!-- Kirjautumistilan näyttö -->
    <div id="loginStatus" class="login-status"></div>

    <div class="content-box">
        <h1>Ruokareseptihaku</h1>
        <p class="p12">Etsi, jaa, kokeile ja haasta ystäviä tekemään herkullisia reseptejä vaivattomasti!</p>

        <main>
            <!-- Hakukenttä -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Kirjoita ainesosia tai ruokalajeja">
                <button id="searchButton">Hae</button>
            </div>

            <!-- Linkit -->
            <div class="button-container">
                <button onclick="window.location.href='index2.html'">Selaa reseptejä</button>
                <button onclick="window.location.href='login.html'">Kirjaudu</button>
                <button onclick="window.location.href='register.html'">Uusi käyttäjä</button>
            </div>

            <!-- Tulokset -->
            <div id="resultsContainer"></div>
        </main>
    </div>

    <!-- Footer -->
    <div id="footer">
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </div>
    <script src="loginStatus.js?v=1.0"></script>
    <script src="search.js"></script>
</body>
</html>
