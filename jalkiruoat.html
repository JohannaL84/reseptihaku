<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jälkiruoat</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .results-container {
            margin: 20px auto;
            max-width: 800px;
            overflow-y: auto;
            max-height: 500px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .recipe-card {
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }

        .recipe-card:hover {
            background-color: #ffe5b4;
        }

        .recipe-card h3 {
            font-size: 1.5rem;
            color: #ff6600;
        }

        .recipe-card a {
            display: block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .recipe-card a:hover {
            text-decoration: underline;
        }

        .load-more-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            background-color: #ff6600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        .load-more-button:hover {
            background-color: #ff5500;
        }
    </style>
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <div class="content-box"> <!-- Vaalea laatikko -->
        <header>
            <h1>Jälkiruoat</h1>
            <p class="p2">Täältä löydät ihanat jälkiruoat, jotka varmasti kruunaavat ateriasi!</p>
        </header>

        <section id="resultsContainer" class="results-container">
            <p>Ladataan jälkiruokia...</p>
        </section>

        <button id="loadMoreButton" class="load-more-button" style="display: none;">Lataa lisää</button>
    </div>

    <footer>
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const API_URL = 'https://api.spoonacular.com/recipes/complexSearch';
            const API_KEY = 'd451e3d4e29b4796b9fa627c0c18a6ff';  // Lisää oma API-avaimesi
            const query = 'dessert';  // Hakutermi "dessert"

            const resultsContainer = document.getElementById('resultsContainer');
            const loadMoreButton = document.getElementById('loadMoreButton');

            let offset = 0;  // Seuraavan sivun aloituskohta
            const limit = 10;  // Reseptien määrä per lataus

            function fetchDessertRecipes() {
                fetch(`${API_URL}?query=${query}&offset=${offset}&number=${limit}&apiKey=${API_KEY}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('API-haku epäonnistui');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.results.length === 0) {
                            if (offset === 0) {
                                resultsContainer.innerHTML = '<p>Ei löytynyt jälkiruokia.</p>';
                            } else {
                                loadMoreButton.style.display = 'none';
                                resultsContainer.innerHTML += '<p>Ei enää reseptejä ladattavaksi.</p>';
                            }
                            return;
                        }

                        // Lisätään uudet reseptit
                        data.results.forEach(recipe => {
                            const recipeElement = document.createElement('div');
                            recipeElement.classList.add('recipe-card');
                            recipeElement.innerHTML = `
                                <h3>${recipe.title}</h3>
                                <p>Katso reseptin tarkemmat tiedot linkistä.</p>
                                <a href="https://spoonacular.com/recipes/${recipe.title.replace(/ /g, '-').toLowerCase()}-${recipe.id}" target="_blank">Avaa resepti</a>
                            `;
                            resultsContainer.appendChild(recipeElement);
                        });

                        // Näytä "Lataa lisää" -nappi, jos reseptejä on vielä jäljellä
                        loadMoreButton.style.display = 'block';
                        offset += limit;  // Päivitä offset seuraavaa hakua varten
                    })
                    .catch(error => {
                        console.error('Virhe haun aikana:', error);
                        resultsContainer.innerHTML = '<p>Virhe haun aikana. Yritä uudelleen myöhemmin.</p>';
                    });
            }

            // Ensimmäinen lataus
            fetchDessertRecipes();

            // Lataa lisää reseptejä, kun painetaan nappia
            loadMoreButton.addEventListener('click', fetchDessertRecipes);
        });
    </script>
</body>
</html>
