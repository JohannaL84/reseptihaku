<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekisteröidy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Otsikko, joka toimii linkkinä etusivulle -->
    <h1><a href="index.html" id="homeLink">Ruokareseptihaku</a></h1>

    <h2>Luo uusi tunnus</h2>

    <form id="registerForm">
        <label for="emailInput">Sähköposti:</label>
        <input type="email" id="emailInput" placeholder="Anna sähköpostisi" required>

        <label for="passwordInput">Salasana:</label>
        <input type="password" id="passwordInput" placeholder="Anna salasana" required>

        <label for="confirmPasswordInput">Vahvista salasana:</label>
        <input type="password" id="confirmPasswordInput" placeholder="Toista salasana" required>

        <button type="button" onclick="register()">Luo tunnus</button>
    </form>

    <p id="registerMessage"></p>

    <script>
        function register() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            const message = document.getElementById('registerMessage');

            if (!email || !password || !confirmPassword) {
                message.textContent = 'Täytä kaikki kentät!';
                message.style.color = 'red';
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = 'Salasanat eivät täsmää!';
                message.style.color = 'red';
                return;
            }

            message.textContent = 'Tunnus luotu onnistuneesti!';
            message.style.color = 'green';

            // Tyhjennä lomake
            document.getElementById('registerForm').reset();
        }
    </script>
</body>
</html>
