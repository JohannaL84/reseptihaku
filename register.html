<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekisteröidy uudeksi käyttäjäksi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <div class="content-box"> <!-- Vaalea laatikko -->
        <header>
            <h1>Ruokareseptihaku</h1>
            <p class="p2">Liity mukaan ja aloita reseptihakumatkasi jo tänään!</p>
        </header>

        <section class="login-section">
            <h2>Rekisteröidy</h2>
            <form id="register-form">
                <input type="text" id="newUsername" placeholder="Käyttäjätunnus (vain kirjaimia ja numeroita)" required>
                <input type="email" id="newEmail" placeholder="Sähköpostiosoite (esim. nimi@email.com)" required>
                <input type="password" id="newPassword" placeholder="Salasana (väh. 12 merkkiä)" required>
                <input type="password" id="confirmPassword" placeholder="Vahvista salasana" required>
            
                <p id="loadingMessage" style="display: none; color: blue;">⏳ Rekisteröidään...</p>
                <p id="registerError" class="p2" style="color: red;"></p>
            
                <div class="button-container">
                    <button type="submit">Rekisteröidy</button>
                    <button type="button" onclick="location.href='index.html'">Takaisin etusivulle</button>
                </div>
            </form>
            
        </section>
    </div>

    <footer> <!-- Footer -->
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </footer>

    <script src="register.js"></script> <!-- Linkitetään rekisteröintilogiikka -->
</body>
</html>
