<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resepti - Reseptihakusovellus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div>
    
    <!-- Yhdistetty reseptin sisältölaatikko -->
    <div class="content-box recipe-content">
        <header>
            <h1 id="recipe-title">Reseptin nimi</h1>
            <img id="recipe-image" src="images/reseptikuva.png"Reseptin kuva" class="recipe-image">
            <p id="recipe-description">Lyhyt kuvaus reseptistä</p>
        </header>

        <section class="recipe-details">
            <h2>Ainesosat</h2>
            <ul id="ingredient-list"></ul>

            <h2>Ohjeet</h2>
            <p id="instructions"></p>
        </section>

        <button class="back-button" onclick="history.back()">Takaisin hakutuloksiin</button>
    </div>

    <footer id="footer">
        <p>&copy; 2025 Reseptihakusovellus. Kaikki oikeudet pidätetään.</p>
    </footer>

    <script src="recipe.js"></script>
</body>
</html>
