<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omat tiedot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <div class="content-box"> <!-- Vaalea laatikko -->
        <header>
            <h1>Ruokareseptihaku</h1>
            <p>Liity mukaan ja aloita reseptimatkasi jo tänään!</p>
        </header>

    <h2>Käyttäjäprofiili</h2>
        <p>Käyttäjänimi: <span id="profileUsername"></span></p>
    <h3>Omat reseptit</h3>
        <div id="userRecipes"></div>
    <h3>Pisteet</h3>
        <p id="userPoints">0</p>
    <button onclick="logout()">Kirjaudu ulos</button>

    <script>
        const userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];

        function logout() {
            window.location.href = 'index.html';
        }

        function showUserProfile() {
            const username = localStorage.getItem('username');
            document.getElementById('profileUsername').innerText = username;

            const points = localStorage.getItem('points');
            document.getElementById('userPoints').innerText = points;

            const userRecipesDiv = document.getElementById('userRecipes');
            userRecipesDiv.innerHTML = '';
            userRecipes.forEach(recipe => {
                const recipeDiv = document.createElement('div');
                recipeDiv.innerHTML = `
                    <h4>${recipe.name}</h4>
                    <img src="${recipe.thumbnail}" alt="${recipe.name}" width="100">
                    <p>${recipe.instructions}</p>
                `;
                userRecipesDiv.appendChild(recipeDiv);
            });
        }

        showUserProfile();
    </script>

    <footer> <!-- Footer siirretty boksin ulkopuolelle -->
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </footer>
</body>
</html>
