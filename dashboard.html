<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Käyttäjän hallintapaneeli</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
 
        .circle-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
 
        .recipe-circle {
            width: 120px;
            height: 120px;
            background-color: #f4f4f4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: transform 0.2s ease;
        }
 
        .recipe-circle:hover {
            transform: scale(1.1);
            background-color: #e0e0e0;
        }
 
        .delete-button {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
        }
 
        .delete-button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
<div class="background"></div> <!-- Taustakuva -->

 <!-- Kiinteä takaisin-painike -->
 <button class="back-button" onclick="history.back()">&#8592; Takaisin</button>
 
    <div class="content-box"> <!-- Vaalea laatikko -->
<header>
<h1>Tervetuloa, <span id="nickname">Käyttäjä</span>!</h1>
<img id="profile-image" src="default-profile.png" alt="Profiilikuva" class="profile-img">
<p class="p2">Tämä on henkilökohtainen hallintapaneelisi.</p>
</header>
 
        <!-- Käyttäjän tiedot -->
<section class="dashboard-section">
<h2>Omat tiedot</h2>
<p class="p2"><strong>Käyttäjätunnus:</strong> <span id="username"></span></p>
<p class="p2"><strong>Sähköposti:</strong> <span id="email"></span></p>
<p class="p2"><strong>Suoritetut haasteet:</strong> <span id="completedChallenges">0</span></p>
<p class="p2"><strong>Pisteet:</strong> <span id="points">0</span></p>
 
            <!-- Tallennetut reseptit ja reseptin lisäystoiminto -->
<h3 class="p2">Tallennetut reseptit:</h3>
<div id="savedRecipes" class="circle-container"></div>
 
<!-- Linkki reseptin lisäykseen -->
<button id="addRecipeButton" onclick="location.href='lisaaresepti.html'">Lisää oma resepti</button>
</section>
 
        <!-- Toimintopainikkeet -->
<div class="button-container">
<button type="button" onclick="location.href='user_recipes.html'">Omat reseptit</button>
<button type="button" onclick="location.href='index.html'">Takaisin etusivulle</button>
<button type="button" onclick="logout()">Kirjaudu ulos</button>
</div>
</div>
 
<script>
    // Funktio käyttäjän tietojen hakemiseen paikallisesta tallennuksesta
    function fetchUserData() {
        const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));
 
        if (!loggedInUser) {
            alert("\u274c Sinun täytyy kirjautua sisään!");
            window.location.href = "login.html";
            return;
        }
 
        document.getElementById("nickname").textContent = loggedInUser.nickname || loggedInUser.username;
        document.getElementById("username").textContent = loggedInUser.username;
        document.getElementById("email").textContent = loggedInUser.email || "Ei määritelty";
        document.getElementById("completedChallenges").textContent = loggedInUser.completedChallenges || 0;
        document.getElementById("points").textContent = loggedInUser.points || 0;
 
        displaySavedRecipes(loggedInUser);
    }
 
    // Näytä tallennetut reseptit
    function displaySavedRecipes(user) {
        const recipeList = document.getElementById("savedRecipes");
        recipeList.innerHTML = "";
        if (user.savedRecipes && user.savedRecipes.length > 0) {
            user.savedRecipes.forEach((recipe, index) => {
                let circle = document.createElement("div");
                circle.className = "recipe-circle";
                circle.textContent = recipe.name;
                
                // Poistonappi
                let deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.textContent = "X";
                deleteButton.addEventListener("click", function(event) {
                    event.stopPropagation(); // Estä reseptin klikkaustoiminnon suoritus
                    if (confirm(`Haluatko varmasti poistaa reseptin '${recipe.name}'?`)) {
                        user.savedRecipes.splice(index, 1);
                        localStorage.setItem("loggedInUser", JSON.stringify(user));
                        displaySavedRecipes(user);
                    }
                });
 
                circle.appendChild(deleteButton);
                circle.addEventListener("click", function() {
                    alert(`Resepti: ${recipe.name}\n\nAinekset ja ohjeet:\n${recipe.instructions}`);
                });
                recipeList.appendChild(circle);
            });
        } else {
            let message = document.createElement("p");
            message.textContent = "Ei tallennettuja reseptejä.";
            recipeList.appendChild(message);
        }
    }
 
    // Uloskirjautuminen
    function logout() {
        localStorage.removeItem("loggedInUser");
        window.location.href = "login.html";
    }
 
    document.addEventListener("DOMContentLoaded", fetchUserData);
</script>
 
<div id="footer">
    <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
</div>
</body>
</html>
