<!DOCTYPE html>
<html lang="fi">
<head>
    <!-- Sivun metatiedot ja tyylit -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Käyttäjän hallintapaneeli</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Painikkeiden container, jossa painikkeet keskitetään */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        /* Tallennettujen reseptien ympyröiden container */
        .circle-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* Yksittäinen tallennettu resepti ympyränä */
        .recipe-circle {
            width: 120px;
            height: 120px;
            background-color: #f4f4f4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: transform 0.2s ease;
        }

        /* Hover-efekti reseptin ympyrälle */
        .recipe-circle:hover {
            transform: scale(1.1);
            background-color: #e0e0e0;
        }

        /* Poistonappula reseptin ympyrässä */
        .delete-button {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Hover-efekti poistonappulalle */
        .delete-button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <!-- Kirjautumistilan näyttö -->
    <div id="loginStatus" class="login-status"></div>

    <!-- Takaisin-painike, joka ohjaa edelliselle sivulle -->
    <button class="back-button" onclick="history.back()">&#8592; Takaisin</button>

    <!-- Hallintapaneelin sisältölaatikko -->
    <div class="content-box">
        <!-- Sivun otsikko ja käyttäjän tiedot -->
        <header>
            <h1>Tervetuloa, <span id="nickname">Käyttäjä</span>!</h1>
            <img id="profile-image" src="default-profile.png" alt="Profiilikuva" class="profile-img">
            <p class="p2">Tämä on henkilökohtainen hallintapaneelisi.</p>
        </header>

        <!-- Käyttäjän tiedot ja suoritetut haasteet -->
        <section class="dashboard-section">
            <h2>Omat tiedot</h2>
            <p class="p2"><strong>Käyttäjätunnus:</strong> <span id="username"></span></p>
            <p class="p2"><strong>Sähköposti:</strong> <span id="email"></span></p>
            <p class="p2"><strong>Suoritetut haasteet:</strong> <span id="completedChallenges">0</span></p>
            <p class="p2"><strong>Pisteet:</strong> <span id="points">0</span></p>

            <!-- Tallennetut reseptit -->
            <h3 class="p2">Tallennetut reseptit:</h3>
            <div id="savedRecipes" class="circle-container"></div>

            <!-- Linkki reseptin lisäykseen -->
            <button id="addRecipeButton" onclick="location.href='lisaaresepti.html'">Lisää oma resepti</button>
        </section>

        <!-- Hallintapaneelin toimintopainikkeet -->
        <div class="button-container">
            <button type="button" onclick="location.href='user_recipes.html'">Omat reseptit</button>
            <button type="button" onclick="location.href='index.html'">Takaisin etusivulle</button>
            <button type="button" onclick="logout()">Kirjaudu ulos</button>
        </div>
    </div>

    <script>
        // Hakee käyttäjän tiedot paikallisesta tallennuksesta ja näyttää ne hallintapaneelissa
        function fetchUserData() {
            const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

            // Jos käyttäjä ei ole kirjautunut sisään, ohjataan kirjautumissivulle
            if (!loggedInUser) {
                alert("\u274c Sinun täytyy kirjautua sisään!");
                window.location.href = "login.html";
                return;
            }

            // Täytetään käyttäjän tiedot hallintapaneeliin
            document.getElementById("nickname").textContent = loggedInUser.nickname || loggedInUser.username;
            document.getElementById("username").textContent = loggedInUser.username;
            document.getElementById("email").textContent = loggedInUser.email || "Ei määritelty";
            document.getElementById("completedChallenges").textContent = loggedInUser.completedChallenges || 0;
            document.getElementById("points").textContent = loggedInUser.points || 0;

            // Näytetään tallennetut reseptit
            displaySavedRecipes(loggedInUser);
        }

        // Näyttää tallennetut reseptit ympyröinä käyttäjän paneelissa
        function displaySavedRecipes(user) {
            const recipeList = document.getElementById("savedRecipes");
            recipeList.innerHTML = "";

            // Tarkistetaan, onko tallennettuja reseptejä
            if (user.savedRecipes && user.savedRecipes.length > 0) {
                user.savedRecipes.forEach((recipe, index) => {
                    // Luodaan ympyrä, jossa reseptin nimi näkyy
                    let circle = document.createElement("div");
                    circle.className = "recipe-circle";
                    circle.textContent = recipe.name;

                    // Lisätään poistonappi ympyrään
                    let deleteButton = document.createElement("button");
                    deleteButton.className = "delete-button";
                    deleteButton.textContent = "X";

                    // Poistonapin tapahtumankuuntelija
                    deleteButton.addEventListener("click", function(event) {
                        event.stopPropagation(); // Estää reseptin klikkaustoiminnon suorittamisen
                        if (confirm(`Haluatko varmasti poistaa reseptin '${recipe.name}'?`)) {
                            user.savedRecipes.splice(index, 1); // Poistetaan resepti listasta
                            localStorage.setItem("loggedInUser", JSON.stringify(user)); // Päivitetään tallennus
                            displaySavedRecipes(user); // Päivitetään näkymä
                        }
                    });

                    // Lisätään poistonappi ympyrään ja reseptin klikkaustoiminto
                    circle.appendChild(deleteButton);
                    circle.addEventListener("click", function() {
                        alert(`Resepti: ${recipe.name}\n\nAinekset ja ohjeet:\n${recipe.instructions}`);
                    });

                    // Lisätään ympyrä näkymään
                    recipeList.appendChild(circle);
                });
            } else {
                // Jos ei ole tallennettuja reseptejä, näytetään viesti
                let message = document.createElement("p");
                message.textContent = "Ei tallennettuja reseptejä.";
                recipeList.appendChild(message);
            }
        }

        // Kirjaa käyttäjän ulos ja ohjaa kirjautumissivulle
        function logout() {
            localStorage.removeItem("loggedInUser"); // Poistetaan käyttäjätiedot
            window.location.href = "login.html"; // Ohjataan kirjautumissivulle
        }

        // Kun sivu on ladattu, haetaan käyttäjän tiedot
        document.addEventListener("DOMContentLoaded", fetchUserData);
    </script>

    <!-- Footer -->
    <div id="footer">
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </div>

    <!-- JavaScript-tiedostot -->
    <script src="loginStatus.js?v=1.0"></script>
</body>
</html>
