<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Käyttäjän hallintapaneeli</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div> <!-- Taustakuva -->

    <div class="content-box">
        <header>
            <h1>Tervetuloa, <span id="nickname">Käyttäjä</span>!</h1>
            <img id="profile-image" src="default-profile.png" alt="Profiilikuva" class="profile-img">
            <p class="p2">Tämä on henkilökohtainen hallintapaneelisi.</p>
        </header>

        <section class="dashboard-section">
            <h2>Omat tiedot</h2>
            <p><strong>Käyttäjätunnus:</strong> <span id="username"></span></p>
            <p><strong>Sähköposti:</strong> <span id="email"></span></p>
            <p><strong>Suoritetut haasteet:</strong> <span id="completedChallenges">0</span></p>
            <p><strong>Pisteet:</strong> <span id="points">0</span></p>

            <h3>Tallennetut reseptit:</h3>
            <ul id="savedRecipes"></ul>

            <button onclick="logout()">Kirjaudu ulos</button>
        </section>
    </div>

    <footer>
        <p>&copy; 2025 Ruokareseptihaku. Kaikki oikeudet pidätetään.</p>
    </footer>

    <script>
        // Funktio käyttäjän tietojen hakemiseen paikallisesta tallennuksesta
        function fetchUserData() {
            const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

            if (!loggedInUser) {
                alert("❌ Sinun täytyy kirjautua sisään!");
                window.location.href = "login.html";
                return;
            }

            // Näytetään käyttäjätiedot dashboardilla
            document.getElementById("nickname").textContent = loggedInUser.nickname || loggedInUser.username;
            document.getElementById("username").textContent = loggedInUser.username;
            document.getElementById("email").textContent = loggedInUser.email || "Ei määritelty";
            document.getElementById("completedChallenges").textContent = loggedInUser.completedChallenges || 0;
            document.getElementById("points").textContent = loggedInUser.points || 0;

            // Asetetaan profiilikuva, jos se on määritelty
            document.getElementById("profile-image").src = loggedInUser.profileImage || "default-profile.png";

            // Näytetään tallennetut reseptit
            const recipeList = document.getElementById("savedRecipes");
            recipeList.innerHTML = "";
            if (loggedInUser.savedRecipes && loggedInUser.savedRecipes.length > 0) {
                loggedInUser.savedRecipes.forEach(recipe => {
                    let li = document.createElement("li");
                    li.textContent = recipe; // Voit laajentaa näyttämään reseptin tiedot
                    recipeList.appendChild(li);
                });
            } else {
                let li = document.createElement("li");
                li.textContent = "Ei tallennettuja reseptejä.";
                recipeList.appendChild(li);
            }
        }

        // Uloskirjautumisfunktio
        function logout() {
            localStorage.removeItem("loggedInUser");
            window.location.href = "login.html";
        }

        document.addEventListener("DOMContentLoaded", fetchUserData);
    </script>
</body>
</html>
